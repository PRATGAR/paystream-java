spring:
  application:
    name: ledgerline-payments
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

ledgerline:
  import-dir: ./data/bank-drop
  upload-dir: ./data/uploads
  export-dir: ./data/exports
  bank-base-url: https://api.bank.example.com/v2
  vault-key: ZGV2LW9ubHktMTZieXRlcw==
  approved-hosts:
    - hooks.partner.example.com
    - notify.ledgerline.example
  trusted-return-hosts:
    - pay.ledgerline.example
    - checkout.ledgerline.example
